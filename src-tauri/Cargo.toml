[package]
name = "novavault"
description = "NovaVault desktop app: thin Tauri 2 shell around novavault-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
novavault-core = { path = "../crates/novavault-core" }
# `serde` lets command inputs deserialize straight into `SecretString`.
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
