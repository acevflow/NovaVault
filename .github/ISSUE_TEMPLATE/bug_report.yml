name: Bug report
description: Report something in NovaVault that does not work as expected.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security vulnerabilities must not be reported here.** Follow [SECURITY.md](https://github.com/acevflow/NovaVault/blob/main/SECURITY.md) to report them privately.

        Never paste real passwords, recovery codes, secrets or vault files into an issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The minimal steps needed to reproduce the bug, using test data only.
      placeholder: |
        1. Create a new vault
        2. Add a note
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NovaVault version
      description: The release version, or the commit hash if you built from source.
      placeholder: "v0.1.0 or abc1234"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: "Windows 11 23H2, macOS 15.1, Ubuntu 24.04, ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Remove anything sensitive before pasting. This is rendered as plain text.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots (with test data only) or anything else that helps.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this bug has not been reported yet.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
        - label: This report contains no real passwords, recovery codes, secrets or vault files.
          required: true
