[package]
name = "novavault-core"
description = "Cryptography, vault format and key slots for NovaVault (UI-independent)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
getrandom = "0.4.3"
secrecy = "0.10.3"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }

[lints]
workspace = true
