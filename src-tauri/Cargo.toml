[package]
name = "novavault"
description = "NovaVault desktop app: thin Tauri 2 shell around novavault-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Clipboard access from Rust, so copied secrets never pass through the
# webview. No image support; Wayland via the data-control protocol.
# Justified in docs/architecture.md.
arboard = { version = "3.7.0", default-features = false, features = [
    "wayland-data-control",
] }
novavault-core = { path = "../crates/novavault-core" }
# `serde` lets command inputs deserialize straight into `SecretString`.
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
# Reads and writes the non-secret settings file (auto-lock timeout).
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }

# OS lock monitors (suspend and screen lock), one per platform. Versions
# match those already pulled in by Tauri, so no new crates are added on
# Windows and macOS. Justified in docs/architecture.md.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = [
    "NSDistributedNotificationCenter",
    "NSNotification",
    "NSOperation",
    "NSString",
    "block2",
] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3.34", default-features = false }
# Async D-Bus on Tauri's Tokio runtime; no extra executor.
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }

[lints]
workspace = true
